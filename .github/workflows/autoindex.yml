name: Generate Theme Index

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Themes/**/*.css' # Only run when CSS files in Themes/ are changed

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the updated index.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate _index.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const themeDir = 'Themes';
            
            if (!fs.existsSync(themeDir)) {
              console.log('Themes directory not found. Exiting.');
              return;
            }

            const files = fs.readdirSync(themeDir).filter(f => f.endsWith('.css'));
            
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const branch = process.env.GITHUB_REF_NAME;
            
            const themes = [];

            for (const file of files) {
              const filePath = path.join(themeDir, file);
              const content = fs.readFileSync(filePath, 'utf8');

              const extract = (key) => {
                const regex = new RegExp(`@${key}\\s+(.+)`);
                const match = content.match(regex);
                return match ? match[1].trim() : null;
              };

              // Parse metadata with fallbacks, stripping .theme from the filename
              const name = extract('name') || path.parse(file).name.replace(/\.theme$/, '');
              const description = extract('description');
              const author = extract('author') || "Unknown Author";
              const version = extract('version');

              const url = `https://cdn.jsdelivr.net/gh/${repo}@latest/${themeDir}/${file}`;
              const githubUrl = `https://github.com/${repo}/blob/${branch}/${themeDir}/${file}`;

              themes.push({
                name,
                description,
                version,
                author,
                url,
                githubUrl
              });
            }

            const indexPath = path.join(themeDir, '_index.json');
            fs.writeFileSync(indexPath, JSON.stringify({ Themes: themes }, null, 2));
            console.log(`Successfully indexed ${themes.length} themes.`);
            
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update Themes/_index.json"
          file_pattern: 'Themes/_index.json'
